<!DOCTYPE html>
<html>
<head>
    <title>Registration Success</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: #f5f7fb;">

<div class="container mt-5">

    <div class="card shadow p-4 mx-auto text-center" style="max-width: 500px; border-radius: 12px;">

        <h2 class="text-success mb-4">Registration Successful </h2>

        {% if patient %}
             <p><strong>Appointment:</strong> {{ patient.appointment_datetime }}</p>
            <h4>Name: {{ patient.name }}</h4>
            <p><strong>UHID:</strong> {{ patient.uhid }}</p>
            <p><strong>Doctor:</strong> {{ patient.doctor.name }}</p>

        {% else %}

            <p>No data found</p>

        {% endif %}

        <a href="/" class="btn btn-primary mt-3">Go to Home</a>

    </div>

</div>

</body>
</html>
