<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: #f5f7fb;">

<div class="container mt-5">

    <div class="card shadow p-4 mx-auto" style="max-width: 500px; border-radius: 12px;">

        <h2 class="text-center mb-4">Patient Registration</h2>

        {% if doctor %}
            <div class="alert alert-info text-center">
                Doctor: <strong>{{ doctor.name }}</strong>
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <input type="text" name="name" placeholder="Full Name"
                   class="form-control mb-3" required>

            <input type="number" name="age" placeholder="Age"
                   class="form-control mb-3" required>

            <select name="gender" class="form-control mb-3">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <input type="text" name="address" placeholder="Address"
                   class="form-control mb-3" required>

            <input type="text" name="phone" placeholder="Contact Number"
                   class="form-control mb-3" required>

            <input type="email" name="email" placeholder="Email"
                   class="form-control mb-3" required>

            <input type="datetime-local" name="appointment_datetime"
                class="form-control mb-3" required>

            <input type="password" name="password" placeholder="Create Password"
                   class="form-control mb-3" required>

            <button class="btn btn-primary w-100">Register</button>

        </form>

    </div>

</div>

</body>
</html>
