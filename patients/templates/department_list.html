{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">
Departments in {{ hospital.name }}
</h2>

<div class="row">

{% for dept in departments %}

<div class="col-md-4 mb-4">

<div class="card shadow">

<div class="card-body">

<h5>{{ dept.name }}</h5>

<a href="/hospital/department/{{ dept.id }}/doctors/" class="btn btn-success">
View Doctors
</a>

</div>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
